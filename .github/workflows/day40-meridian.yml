name: Day 40 Meridian Capstone

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/day40-meridian.yml
      - day-40-framework-and-capstone/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day-40-framework-and-capstone
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: day-40-framework-and-capstone/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Day 40 scenarios
        id: tests
        run: npm test
        env:
          MERIDIAN_EMAIL: ${{ secrets.MERIDIAN_EMAIL }}
          MERIDIAN_PASSWORD: ${{ secrets.MERIDIAN_PASSWORD }}
          MERIDIAN_POLICY_NUMBER: ${{ secrets.MERIDIAN_POLICY_NUMBER }}

      - name: Generate Allure report
        if: always() && steps.tests.outcome != 'skipped'
        run: npm run report:generate

      - name: Upload reports and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day40-meridian-${{ github.run_id }}
          path: |
            day-40-framework-and-capstone/allure-report/
            day-40-framework-and-capstone/allure-results/
            day-40-framework-and-capstone/playwright-report/
            day-40-framework-and-capstone/test-results/
          if-no-files-found: ignore
          retention-days: 7
